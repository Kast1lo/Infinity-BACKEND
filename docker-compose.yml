services:
  postgres:
    image: postgres:16-alpine
    container_name: infinity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: infinity
      POSTGRES_PASSWORD: infinity
      POSTGRES_DB: infinity
    ports:
      - "5432:5432"
    volumes:
      - infinity-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infinity -d infinity"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  infinity-pgdata:
